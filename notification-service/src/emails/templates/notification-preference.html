<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Notification Preferences Updated</title>
  </head>
  <body style="margin:0; padding:0; background-color:#F3F6FA; font-family: Arial, Helvetica, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table width="100%" max-width="600px" cellpadding="0" cellspacing="0"
            style="background:#FFFFFF; border-radius:12px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.08);">

            <!-- Logo -->
            <tr>
              <td align="center" style="padding:28px; background:#122258;">
                <!-- LOGO PLACEHOLDER -->
                <img src="../../assets/zabbot-logo-white.png" alt="Zabbot Logo" height="38" />
              </td>
            </tr>

            <!-- Content -->
            <tr>
              <td style="padding:32px;">
                <h2 style="margin:0 0 16px; color:#122258; font-size:22px;">
                  Notification Settings Updated 🔔
                </h2>

                <p style="margin:0 0 20px; color:#4A5565; font-size:16px; line-height:1.6;">
                  Hi {{firstName}}, you’ve successfully updated your notification
                  preferences on Zabbot.
                </p>

                <!-- Preference Card -->
                <div
                  style="
                    background:#E3F5FF;
                    border-left:6px solid #207EC5;
                    padding:16px;
                    border-radius:10px;
                    margin:24px 0;
                  "
                >
                  <p style="margin:0; font-size:15px; color:#101828;">
                    <strong>New Preference:</strong>
                  </p>
                  <p style="margin:8px 0 0; font-size:18px; font-weight:600; color:#122258;">
                    {{notificationPreference}}
                  </p>
                </div>

                <p style="margin:0; color:#6A7282; font-size:14px; line-height:1.6;">
                  You can change this anytime from your account settings.
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding:20px; background:#F3F6FA; text-align:center;">
                <p style="margin:0; font-size:13px; color:#6A7282;">
                  © 2025 Zabbot • Culture-Powered Learning
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
