<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Welcome to Zabbot</title>
  </head>
  <body style="margin:0; padding:0; background-color:#F3F6FA; font-family: Arial, Helvetica, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table width="100%" max-width="600px" cellpadding="0" cellspacing="0"
            style="background:#FFFFFF; border-radius:12px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.08);">

            <!-- Logo -->
            <tr>
              <td align="center" style="padding:32px; background:#122258;">
                <!-- LOGO PLACEHOLDER -->
                <img src="{{LOGO_URL}}" alt="Zabbot Logo" height="40" />
              </td>
            </tr>

            <!-- Content -->
            <tr>
              <td style="padding:32px;">
                <h1 style="margin:0 0 16px; color:#122258; font-size:24px;">
                  Ẹ káàbọ̀, {{firstName}} 👋
                </h1>

                <p style="margin:0 0 24px; color:#4A5565; font-size:16px; line-height:1.6;">
                  Welcome to <strong>Zabbot</strong> — your AI-powered gateway to learning
                  language through culture.
                </p>

                <p style="margin:0 0 12px; color:#101828; font-size:16px;">
                  Your One-Time Password (OTP):
                </p>

                <!-- OTP Box -->
                <div style="text-align:center; margin:24px 0;">
                  <span
                    style="
                      display:inline-block;
                      background:#F9C10F;
                      color:#122258;
                      font-size:28px;
                      font-weight:700;
                      letter-spacing:6px;
                      padding:16px 28px;
                      border-radius:10px;
                    "
                  >
                    {{otp}}
                  </span>
                </div>

                <p style="margin:24px 0 0; color:#4A5565; font-size:14px; line-height:1.6;">
                  This code expires shortly. If you didn’t request this, you can safely
                  ignore this email.
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding:20px; background:#F3F6FA; text-align:center;">
                <p style="margin:0; font-size:13px; color:#6A7282;">
                  © 2025 Zabbot • Learn. Speak. Belong.
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
