<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Your Zabbot Verification Code</title>
  </head>
  <body style="margin:0; padding:0; background-color:#F3F6FA; font-family: Arial, Helvetica, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table width="100%" max-width="600px" cellpadding="0" cellspacing="0"
            style="background:#FFFFFF; border-radius:12px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.08);">

            <!-- Logo -->
            <tr>
              <td align="center" style="padding:28px; background:#207EC5;">
                <!-- LOGO PLACEHOLDER -->
                <img src="{{LOGO_URL}}" alt="Zabbot Logo" height="36" />
              </td>
            </tr>

            <!-- Content -->
            <tr>
              <td style="padding:32px;">
                <h2 style="margin:0 0 16px; color:#122258; font-size:22px;">
                  Verify Your Action
                </h2>

                <p style="margin:0 0 20px; color:#4A5565; font-size:16px; line-height:1.6;">
                  Use the code below to complete your request on Zabbot.
                </p>

                <!-- OTP -->
                <div style="text-align:center; margin:32px 0;">
                  <span
                    style="
                      display:inline-block;
                      border:2px dashed #207EC5;
                      color:#122258;
                      font-size:26px;
                      font-weight:700;
                      padding:14px 26px;
                      border-radius:12px;
                      letter-spacing:5px;
                    "
                  >
                    {{otp}}
                  </span>
                </div>

                <p style="margin:0; color:#6A7282; font-size:14px;">
                  If you didn’t initiate this request, please ignore this email or
                  contact support.
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding:20px; background:#F3F6FA; text-align:center;">
                <p style="margin:0; font-size:13px; color:#6A7282;">
                  Zabbot Security • Powered by AI
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
